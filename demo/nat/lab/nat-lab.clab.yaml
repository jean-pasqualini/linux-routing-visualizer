name: demo-nat

mgmt:
  # network: none
  network: clab_nat
  ipv4-subnet: 172.30.30.0/24
  ipv6-subnet: 3fff:172:30:30::/64

topology:
  nodes:
    client:
      kind: linux
      image: docker.io/ubuntu:latest
      binds:
        - client.sh:/init.sh
      cmd: "/bin/bash /init.sh"

    r1:
      kind: linux
      image: docker.io/ubuntu:latest
      sysctls:
        net.ipv4.ip_forward: "1"
      binds:
        - router.sh:/init.sh
      cmd: "/bin/bash /init.sh"

    server:
      kind: linux
      image: docker.io/ubuntu:latest
      binds:
        - server.sh:/init.sh
      cmd: "/bin/bash /init.sh"

  links:
    - endpoints: ["client:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "server:eth1"]
